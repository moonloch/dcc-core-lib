name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm (from packageManager) and Node, then runs
      # `pnpm install --frozen-lockfile`.
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run checks
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Check generated API docs are current
        run: pnpm run docs:check
