name: Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (from packageManager) and Node, then runs
      # `pnpm install --frozen-lockfile`.
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          # Registry auth for the @moonloch scope (pnpm >= 11.10).
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@moonloch": {
                  "authToken": ${{ toJSON(secrets.GITHUB_TOKEN) }}
                }
              }
            }
