name: Create Release

# On every push to main: if no GitHub release exists for the package.json
# version, create a draft release for it. If one already exists, do nothing.
# Versions are bumped in a `chore: release X.Y.Z` PR (see CONTRIBUTING.md).

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (from packageManager) and Node, then runs
      # `pnpm install --frozen-lockfile`.
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run checks
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Check for an existing release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$CURRENT_VERSION" > /dev/null 2>&1; then
            echo "Release v$CURRENT_VERSION already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.package.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          draft: true
          generate_release_notes: true

