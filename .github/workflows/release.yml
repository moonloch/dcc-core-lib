name: Create Release

# On every push to main: if no GitHub release exists for the package.json
# version, create a draft release for it. If one already exists, open (or
# reuse) a pull request that bumps the patch version instead of pushing to
# main, so main can stay branch-protected. Merging that PR re-runs this
# workflow and creates the draft release for the new version. Pushes that
# come from merging a Dependabot PR never open a bump PR.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (from packageManager) and Node, then runs
      # `pnpm install --frozen-lockfile`.
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run checks
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Check for an existing release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$CURRENT_VERSION" > /dev/null 2>&1; then
            echo "Release v$CURRENT_VERSION already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Dependabot merges should not cut a new patch version. The push actor is
      # whoever clicked merge, so look up the PR behind the commit instead.
      - name: Check whether the push came from a Dependabot PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].user.login // ""')
          echo "Merged PR author: ${PR_AUTHOR:-<none>}"
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependabot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.package.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          draft: true
          generate_release_notes: true

      - name: Open a version-bump pull request
        if: steps.package.outputs.exists == 'true' && steps.source.outputs.dependabot == 'false'
        env:
          # A personal access token in RELEASE_PR_TOKEN (contents + pull
          # requests: write) makes the CI workflow run on the bump PR.
          # With the default token the PR is still opened, but GitHub does
          # not trigger workflows for it: close and reopen the PR, or push
          # to its branch, to get the required status check.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          CURRENT_VERSION="${{ steps.package.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          BRANCH="release/bump-v$NEW_VERSION"

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A bump PR from $BRANCH is already open; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          pnpm pkg set version="$NEW_VERSION"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push --force origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Release v$CURRENT_VERSION already exists, so the push to main did not create a draft release. Merging this PR bumps \`package.json\` to $NEW_VERSION; the Create Release workflow then creates the draft release for v$NEW_VERSION."
          echo "::notice::Release v$CURRENT_VERSION exists; opened a PR from $BRANCH bumping to $NEW_VERSION"
